<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARLO THORNE | ZERO TRUST PROJECT</title>
    <style>
        body { 
            background: #050505; 
            color: #d12f2f; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
            overflow: hidden;
        }

        /* Ефект на скенирање на екранот */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .box {
            border: 1px solid #d12f2f;
            padding: 60px;
            background: rgba(209, 47, 47, 0.02);
            box-shadow: 0 0 50px rgba(209, 47, 47, 0.1);
            max-width: 700px;
            position: relative;
            z-index: 3;
        }

        h1 { 
            font-size: 3.5rem; 
            letter-spacing: 15px; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            font-weight: 900;
            text-shadow: 0 0 10px rgba(209, 47, 47, 0.5);
        }

        .sub { 
            color: #555; 
            font-size: 1.2rem; 
            margin-bottom: 40px; 
            letter-spacing: 7px; 
            font-weight: bold;
        }

        .alert { 
            background: #d12f2f; 
            color: #fff; 
            padding: 12px 30px; 
            font-weight: bold;
            display: inline-block;
            animation: blink 1.5s infinite;
            font-size: 1rem;
            letter-spacing: 3px;
            box-shadow: 0 0 15px rgba(209, 47, 47, 0.4);
        }

        @keyframes blink { 
            0% {opacity: 1;} 
            50% {opacity: 0.2;} 
            100% {opacity: 1;} 
        }

        .msg { 
            color: #888; 
            margin-top: 40px; 
            font-size: 0.95rem; 
            line-height: 2; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        .footer-info { 
            margin-top: 50px; 
            font-size: 0.75rem; 
            color: #222; 
            border-top: 1px solid #151515; 
            padding-top: 25px; 
            letter-spacing: 2px;
        }

        .glitch-text {
            color: #444;
            font-size: 0.7rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>ARLO THORNE</h1>
        <div class="sub">ZERO TRUST PROJECT</div>
        
        <div class="alert">SYSTEM UNDER RECONSTRUCTION</div>
        
        <div class="msg">
            ENCRYPTION PROTOCOLS IN PROGRESS... <br> 
            MISSION ASSETS ARE CURRENTLY CLASSIFIED. <br>
            GLOBAL DEPLOYMENT INITIALIZING.
        </div>
        
        <div class="footer-info">
            SECURITY: OMEGA-LEVEL | STATUS: ENCRYPTED | NODE: NORTH_MACEDONIA_01
        </div>
        <div class="glitch-text">WAITING FOR HANDSHAKE... ACCESS_TOKEN_REQUIRED</div>
    </div>
</body>
</html>
