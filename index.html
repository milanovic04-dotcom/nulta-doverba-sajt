<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРЛО ТОРН | НУЛТА ДОВЕРБА</title>
    <style>
        body { 
            background: #050505; 
            color: #d12f2f; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }
        .box {
            border: 2px solid #d12f2f;
            padding: 40px;
            background: rgba(209, 47, 47, 0.03);
            box-shadow: 0 0 30px rgba(209, 47, 47, 0.1);
            max-width: 500px;
        }
        h1 { font-size: 2.5rem; letter-spacing: 8px; margin-bottom: 5px; text-transform: uppercase; }
        .sub { color: #666; font-size: 1rem; margin-bottom: 25px; letter-spacing: 3px; }
        .alert { 
            background: #d12f2f; 
            color: #fff; 
            padding: 8px 20px; 
            font-weight: bold;
            display: inline-block;
            animation: blink 1.2s infinite;
            font-size: 0.9rem;
        }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }
        .msg { color: #888; margin-top: 25px; font-size: 0.85rem; line-height: 1.6; }
        .code { margin-top: 20px; font-size: 0.7rem; color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h1>АРЛО ТОРН</h1>
        <div class="sub">НУЛТА ДОВЕРБА</div>
        <div class="alert">СИСТЕМОТ Е ПОД РЕКОНСТРУКЦИЈА</div>
        <div class="msg">
            ПРИСТАПОТ Е ПРИВРЕМЕНО ОГРАНИЧЕН. <br> 
            СЕРВЕРИТЕ СЕ ЕНКРИПТИРААТ ЗА НОВАТА МИСИЈА. <br>
            ВЕ МОЛИМЕ, ОБИДЕТЕ СЕ ПОДОЦНА.
        </div>
        <div class="code">ERROR_CODE: 403_ACCESS_DENIED | STATUS: OFFLINE</div>
    </div>
</body>
</html>
